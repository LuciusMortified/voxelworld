name: Analysis

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VW_CMAKE_VERSION: 4.4.0
  VW_LLVM_VERSION: 20

# Динамические проверки идут на Linux не из любви к нему, а по необходимости:
# на Windows нет ни UBSan, ни LeakSanitizer, ни TSan — MSVC умеет только ASan.
# Ровно поэтому здесь собирается headless-половина движка (core, ecs, world),
# которая ни при чём с GPU и переносима: Clang с libc++ даёт свой std-модуль,
# и `import std` работает штатным путём CMake, без std.ixx от MSVC.
jobs:
  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # ASan на Linux включает LeakSanitizer по умолчанию — отсюда и утечки.
          - name: address-undefined
            flags: '-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer'
          # TSan несовместим с ASan, поэтому отдельный прогон. Гонки искать есть
          # где: chunk_loader и light_baker держат пулы потоков.
          - name: thread
            flags: '-fsanitize=thread -fno-omit-frame-pointer'

    name: sanitizers (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v6

      - name: Install Clang and libc++
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.VW_LLVM_VERSION }}
          sudo apt-get install -y \
            libc++-${{ env.VW_LLVM_VERSION }}-dev \
            libc++abi-${{ env.VW_LLVM_VERSION }}-dev

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.VW_CMAKE_VERSION }}
          ninjaVersion: latest

      # Без vcpkg: единственная зависимость здесь — Catch2, и его нужно собрать
      # теми же флагами, что и остальное (см. tests/CMakeLists.txt).
      - name: Configure
        run: >
          cmake -B build -S . -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++-${{ env.VW_LLVM_VERSION }}
          -DCMAKE_C_COMPILER=clang-${{ env.VW_LLVM_VERSION }}
          -DCMAKE_CXX_FLAGS="-stdlib=libc++ ${{ matrix.flags }}"
          -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ ${{ matrix.flags }}"
          -DVW_BUILD_GFX=OFF -DVW_BUILD_APPS=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
          LSAN_OPTIONS: report_objects=1
        run: ctest --test-dir build --output-on-failure

  # Разборщики .vox и .voxa — единственное место, куда попадает содержимое, за
  # которое движок не отвечает: файл мог быть написан руками, испорчен при
  # переносе или прийти откуда угодно. Фаззер бьёт ровно по этой площади.
  #
  # Прогон короткий и стережёт регрессии, а не ищет новое: минута на разборщик
  # при десятках тысяч запусков в секунду перебирает больше, чем весь набор
  # тестов за всю его жизнь. Затравка — те же файлы, что лежат в assets/.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Clang and libc++
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.VW_LLVM_VERSION }}
          sudo apt-get install -y \
            libc++-${{ env.VW_LLVM_VERSION }}-dev \
            libc++abi-${{ env.VW_LLVM_VERSION }}-dev

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.VW_CMAKE_VERSION }}
          ninjaVersion: latest

      # Тесты здесь не нужны, поэтому и Catch2 не нужен: собирается только ядро
      # и две цели фаззинга.
      - name: Configure
        run: >
          cmake -B build-fuzz -S . -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++-${{ env.VW_LLVM_VERSION }}
          -DCMAKE_C_COMPILER=clang-${{ env.VW_LLVM_VERSION }}
          -DCMAKE_CXX_FLAGS="-stdlib=libc++ -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -fsanitize=address,undefined"
          -DVW_BUILD_GFX=OFF -DVW_BUILD_APPS=OFF -DVW_BUILD_TESTS=OFF
          -DVW_BUILD_FUZZERS=ON

      - name: Build
        run: cmake --build build-fuzz

      # Первый каталог libFuzzer считает рабочим корпусом и пишет туда всё
      # найденное, поэтому он временный, а assets/ идёт следом — только как
      # затравка и только на чтение.
      - name: Fuzz the .vox parser
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >
          mkdir -p corpus/vox &&
          ./build-fuzz/tests/fuzz/vox_parse_fuzzer
          -max_total_time=60 -print_final_stats=1 -artifact_prefix=vox-
          corpus/vox assets/models

      - name: Fuzz the .voxa parser
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >
          mkdir -p corpus/voxa &&
          ./build-fuzz/tests/fuzz/voxa_parse_fuzzer
          -max_total_time=60 -print_final_stats=1 -artifact_prefix=voxa-
          corpus/voxa assets/animations

      # Вход, на котором фаззер упал, — единственное, что нужно для повторения
      # падения. Без выгрузки он остался бы на удалённой машине.
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            vox-*
            voxa-*
          if-no-files-found: ignore

  # Сколько ядра тесты действительно проходят. Вопрос не праздный: под
  # санитайзерами исполняется ровно то, до чего добрались тесты, и без этого
  # числа непонятно, чего стоит их зелёный прогон.
  #
  # Порога намеренно нет. Порог заставляет писать тесты ради процента, а
  # интересна здесь динамика: отчёт кладётся в сводку джоба, и падение видно
  # глазами при обычном чтении.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Clang and libc++
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.VW_LLVM_VERSION }}
          sudo apt-get install -y \
            libc++-${{ env.VW_LLVM_VERSION }}-dev \
            libc++abi-${{ env.VW_LLVM_VERSION }}-dev

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.VW_CMAKE_VERSION }}
          ninjaVersion: latest

      - name: Configure
        run: >
          cmake -B build-cov -S . -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++-${{ env.VW_LLVM_VERSION }}
          -DCMAKE_C_COMPILER=clang-${{ env.VW_LLVM_VERSION }}
          -DCMAKE_CXX_FLAGS="-stdlib=libc++ -fprofile-instr-generate -fcoverage-mapping"
          -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -fprofile-instr-generate"
          -DVW_BUILD_GFX=OFF -DVW_BUILD_APPS=OFF

      - name: Build
        run: cmake --build build-cov

      # По файлу на процесс: тесты запускаются каждый своим, и один общий путь
      # они бы затирали друг другу.
      - name: Test
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/prof/%p.profraw
        run: ctest --test-dir build-cov --output-on-failure

      - name: Report
        run: |
          profdata=llvm-profdata-${{ env.VW_LLVM_VERSION }}
          cov=llvm-cov-${{ env.VW_LLVM_VERSION }}
          $profdata merge -sparse prof/*.profraw -o merged.profdata

          objects="build-cov/tests/core_tests"
          for t in ecs_tests world_tests; do
            objects="$objects -object build-cov/tests/$t"
          done

          # Ни зависимости, ни сами тесты: измеряется движок, а не то, чем его
          # измеряют.
          skip='.*(vcpkg_installed|_deps|/tests/).*'

          {
            echo '## Покрытие headless-ядра'
            echo
            echo '```'
            $cov report $objects -instr-profile=merged.profdata \
              -ignore-filename-regex="$skip" engine
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          $cov show $objects -instr-profile=merged.profdata \
            -ignore-filename-regex="$skip" -format=html -o coverage-html engine

      - name: Upload the line-by-line report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html

  # ASan ещё раз, но уже на той сборке, которой пользуются на самом деле:
  # у MSVC своя раскладка объектов и свой аллокатор, и промахи по границам
  # буферов там свои. Заодно это единственное место, где под санитайзер
  # попадает мешер из vw.gfx — он на CPU и устройство не открывает.
  asan-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Export cache tokens for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: latest
          cache: true

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.VW_CMAKE_VERSION }}
          ninjaVersion: latest

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      # RelWithDebInfo, а не Debug: ASan от MSVC не уживается с /RTC1, который
      # CMake кладёт в отладочную конфигурацию, и требует неинкрементальной
      # линковки.
      #
      # Catch2 берётся не из vcpkg, а собирается из исходников (см.
      # tests/CMakeLists.txt): ASan меняет раскладку строк и векторов, и
      # предсобранная библиотека не линкуется с инструментированными объектами —
      # LNK2038 про annotate_string. Остальные зависимости остаются из vcpkg,
      # поэтому под санитайзер попадает и мешер из vw.gfx.
      - name: Configure
        env:
          VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
        run: >
          cmake -B build-asan -S . -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DVW_BUILD_APPS=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Catch2=ON
          -DCMAKE_CXX_FLAGS="/fsanitize=address"
          -DCMAKE_EXE_LINKER_FLAGS="/INCREMENTAL:NO"
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build-asan

      - name: Test
        run: ctest --test-dir build-asan --output-on-failure
