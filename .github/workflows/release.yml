name: Release

on:
  push:
    tags: ['v*']

env:
  VW_CMAKE_VERSION: 4.4.0

# Сборка только под Windows: PRD называет её единственной платформой релиза, а
# полная конфигурация с vw.gfx на Linux не проверена — зависимости из vcpkg
# собираются другой стандартной библиотекой. Прежний linux-джоб на gcc-13 не мог
# собраться в принципе и падал на конфигурации.
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: latest
          cache: true

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.VW_CMAKE_VERSION }}
          ninjaVersion: latest

      # Без окружения Visual Studio не найти std.ixx, из которого собирается
      # std-модуль.
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Configure
        run: >
          cmake -B build -S . -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVW_BUILD_TESTS=OFF
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build sculptor
        run: cmake --build build --target sculptor

      # Ninja — одноконфигурационный генератор: бинарь и шейдеры лежат прямо в
      # каталоге таргета, без подкаталога конфигурации.
      - name: Package
        shell: bash
        run: |
          mkdir package
          cp build/apps/sculptor/sculptor.exe package/
          cp build/apps/sculptor/*.dll package/ 2>/dev/null || true
          cp -r build/apps/sculptor/shaders package/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sculptor-windows
          path: package/

  release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create zip archive
        run: cd sculptor-windows && zip -r ../sculptor-${{ github.ref_name }}-windows.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: sculptor-${{ github.ref_name }}-windows.zip
          generate_release_notes: true
