name: CI

# Только push: pull_request на том же коммите заводит второй, точно такой же
# прогон — у него свой ref, и concurrency их не схлопывает.
on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Версия прибита намеренно: `import std` открывается точным UUID, который
  # меняется в каждом релизе CMake (таблица — в корневом CMakeLists.txt).
  # Раннер обновляется сам, и без этой строки очередной CMake молча закрывает
  # гейт, роняя сборку на генерации.
  VW_CMAKE_VERSION: 4.4.0
  VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'

# The build is Windows-only by construction: `import std` needs a std module,
# and Clang targeting the MSVC ABI builds it from MSVC's own std.ixx (see
# cmake/vw_std_module.cmake). The sanitizer workflow covers the headless half
# of the engine on Linux, where Clang and libc++ bring a std module of their own.
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc, clang]
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v6

      - name: Export cache tokens for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: latest
          cache: true

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.VW_CMAKE_VERSION }}
          ninjaVersion: latest

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Configure
        run: >
          cmake -B build -S . -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          ${{ matrix.compiler == 'clang' && '-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang++' || '' }}
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  headless:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Export cache tokens for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.VW_CMAKE_VERSION }}
          ninjaVersion: latest

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      # No Vulkan SDK on purpose: vw.core, vw.ecs and vw.world must build and
      # test on a machine that has never seen a GPU.
      #
      # Ядро собирается без единого предупреждения, поэтому здесь они ошибки:
      # регрессия не пройдёт. У vw.gfx и приложений долг ещё не выплачен, и в
      # остальных джобах предупреждения остаются предупреждениями.
      - name: Configure without a GPU
        run: >
          cmake -B build-headless -S . -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVW_BUILD_GFX=OFF -DVW_BUILD_APPS=OFF
          -DVW_WARNINGS_AS_ERRORS=ON
          -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build-headless

      - name: Test
        run: ctest --test-dir build-headless --output-on-failure

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Interface hygiene
        run: python scripts/lint_modules.py
